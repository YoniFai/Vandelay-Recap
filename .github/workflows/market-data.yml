name: Vandelay morning data pull

on:
  schedule:
    # 08:35 ET — after the 08:30 economic releases, so the whole 94-name screen sits
    # on one side of them. GitHub cron is UTC and ignores DST, so both fire; the
    # window guard admits late runs and the once-per-day check keeps one commit:
    # 12:35Z = 08:35 EDT, 13:35Z = 08:35 EST.
    # A7/A6 2026-10-11: GitHub fires scheduled runs up to ~5 h late (runs #57-#62 at 18:28-19:29Z); the guard is a window, not an hour match, and dedupe is once per ET day.
    - cron: "35 12 * * 1-5"
    - cron: "35 13 * * 1-5"
    # 1015 stale-chip fix: a second, post-close slot (17:35 ET; 21:35Z EDT /
    # 22:35Z EST) so filings + prices are re-pulled after the 16:00 close.
    # Before this, data stamped ~13:36 went STALE at 16:00 every day.
    - cron: "35 21 * * 1-5"
    - cron: "35 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # One guard for the whole job, so market data and news never disagree about
      # whether this is the run of the day.
      - name: Is this inside the pull window
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — running"
            exit 0
          fi
          ET_HOUR=$(TZ=America/New_York date +%H)
          # Two slots per ET day: am (before 16:00) and close (16:00 on).
          # Dedupe is once per slot, keyed off the last screen.json commit.
          slot() { if [ "$((10#$1))" -lt 16 ]; then echo am; else echo close; fi; }
          if [ "$ET_HOUR" -ge 8 ] && [ "$ET_HOUR" -le 23 ]; then
            LAST_CI=$(git log -1 --format=%cI -- data/screen.json)
            if [ -z "$LAST_CI" ]; then
              LAST_KEY=none
            else
              LAST_KEY="$(TZ=America/New_York date -d "$LAST_CI" +%F)-$(slot "$(TZ=America/New_York date -d "$LAST_CI" +%H)")"
            fi
            NOW_KEY="$(TZ=America/New_York date +%F)-$(slot "$ET_HOUR")"
            if [ "$LAST_KEY" = "$NOW_KEY" ]; then
              echo "run=no" >> "$GITHUB_OUTPUT"
              echo "skip: already pulled this slot (${LAST_KEY} ET)"
            else
              echo "slot=$(slot "$ET_HOUR")" >> "$GITHUB_OUTPUT"
              echo "run=yes" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "skip: ${ET_HOUR}:xx ET is outside the 08:00-23:59 ET pull window"
          fi

      # continue-on-error: a crash here must not abort the job, or data/ is left
      # with no screen AND no failures.json to explain why.
      - name: Fetch market data
        if: steps.window.outputs.run == 'yes'
        continue-on-error: true
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: node fetch-market-data.mjs

      - name: Fetch filings and newswire feeds
        if: steps.window.outputs.run == 'yes'
        continue-on-error: true
        run: node fetch-news.mjs

      - name: Commit the morning pull
        if: steps.window.outputs.run == 'yes'
        run: |
          git config user.name "vandelay-data-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change to commit"
          else
            git commit -m "data: ${{ steps.window.outputs.slot == 'close' && 'close' || 'morning' }} pull $(date -u +%Y-%m-%d\ %H:%MZ)"
            # main may have moved while the pull was running (a hand edit,
            # another run). Rebase onto it rather than failing the push.
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Report what landed
        if: steps.window.outputs.run == 'yes'
        run: |
          for f in screen earnings shorts failures filings wires news-failures; do
            if [ -f "data/$f.json" ]; then
              echo "ok   data/$f.json ($(wc -c < data/$f.json) bytes)"
            else
              echo "MISS data/$f.json"
            fi
          done
