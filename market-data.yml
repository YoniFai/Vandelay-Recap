name: Vandelay morning data pull

on:
  schedule:
    # 07:30 ET year-round. GitHub cron is UTC and does not observe DST, so both
    # hours fire and the script itself no-ops unless it is 07:00–07:59 in New York.
    - cron: "30 11 * * 1-5" # 07:30 ET during EDT
    - cron: "30 12 * * 1-5" # 07:30 ET during EST
  workflow_dispatch: # run by hand from the Actions tab, any time

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch market data
        run: node pipeline/fetch-market-data.mjs

      - name: Fetch filings and newswire feeds
        run: node pipeline/fetch-news.mjs

      - name: Commit the morning pull
        run: |
          git config user.name "vandelay-data-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change to commit"
          else
            git commit -m "data: morning pull $(date -u +%Y-%m-%d\ %H:%MZ)"
            git push
          fi
